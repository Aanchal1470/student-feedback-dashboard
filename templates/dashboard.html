<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback Analytics Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #243b5a;
            padding: 30px;
        }

        .dashboard {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 34px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .card h3 {
            color: #718096;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 32px;
            font-weight: bold;
        }

        .positive {
            color: #22a06b;
        }

        .neutral {
            color: #d69e2e;
        }

        .negative {
            color: #e53e3e;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .chart-container h2 {
            margin-bottom: 20px;
        }

        .chart-box {
            max-width: 500px;
            margin: auto;
        }

        .table-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .table-container h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #667eea;
            color: white;
        }

        tr:hover {
            background: #f7fafc;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .charts {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>Student Feedback Analytics</h1>

        <p class="subtitle">
            Real-time overview of student feedback and sentiment
        </p>


        <!-- Summary Cards -->

        <div class="cards">

            <div class="card">
                <h3>Total Feedback</h3>
                <p id="total">0</p>
            </div>

            <div class="card">
                <h3>Positive</h3>
                <p id="positive" class="positive">0</p>
            </div>

            <div class="card">
                <h3>Neutral</h3>
                <p id="neutral" class="neutral">0</p>
            </div>

            <div class="card">
                <h3>Negative</h3>
                <p id="negative" class="negative">0</p>
            </div>

        </div>


        <!-- Charts -->

        <div class="charts">

            <!-- Sentiment Chart -->

            <div class="chart-container">

                <h2>Sentiment Distribution</h2>

                <div class="chart-box">
                    <canvas id="sentimentChart"></canvas>
                </div>

            </div>


            <!-- Rating Chart -->

            <div class="chart-container">

                <h2>Rating Distribution</h2>

                <div class="chart-box">
                    <canvas id="ratingChart"></canvas>
                </div>

            </div>

        </div>


        <!-- Feedback Table -->

        <div class="table-container">

            <h2>Student Feedback Records</h2>

            <table>

                <thead>

                    <tr>
                        <th>Student</th>
                        <th>Course</th>
                        <th>Subject</th>
                        <th>Rating</th>
                        <th>Sentiment</th>
                    </tr>

                </thead>

                <tbody id="feedbackTable">

                </tbody>

            </table>

        </div>

    </div>


    <script>

        async function loadDashboard() {

            const response = await fetch("/dashboard-data");

            const data = await response.json();


            // Summary Cards

            document.getElementById("total").innerText =
                data.total;

            document.getElementById("positive").innerText =
                data.positive;

            document.getElementById("neutral").innerText =
                data.neutral;

            document.getElementById("negative").innerText =
                data.negative;


            // Feedback Table

            const table =
                document.getElementById("feedbackTable");

            table.innerHTML = "";


            data.feedback.forEach(item => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.course}</td>
                    <td>${item.subject}</td>
                    <td>${item.rating}/5</td>
                    <td>${item.sentiment}</td>
                `;

                table.appendChild(row);

            });


            // Sentiment Chart

            const sentimentCtx =
                document.getElementById("sentimentChart");


            new Chart(sentimentCtx, {

                type: "doughnut",

                data: {

                    labels: [
                        "Positive",
                        "Neutral",
                        "Negative"
                    ],

                    datasets: [{

                        data: [
                            data.positive,
                            data.neutral,
                            data.negative
                        ]

                    }]

                },

                options: {

                    responsive: true,

                    plugins: {

                        legend: {
                            position: "bottom"
                        }

                    }

                }

            });


            // Rating Chart

            const ratingCtx =
                document.getElementById("ratingChart");


            new Chart(ratingCtx, {

                type: "bar",

                data: {

                    labels: [
                        "1 Star",
                        "2 Stars",
                        "3 Stars",
                        "4 Stars",
                        "5 Stars"
                    ],

                    datasets: [{

                        label: "Number of Students",

                        data: [
                            data.ratings["1"],
                            data.ratings["2"],
                            data.ratings["3"],
                            data.ratings["4"],
                            data.ratings["5"]
                        ]

                    }]

                },

                options: {

                    responsive: true,

                    scales: {

                        y: {

                            beginAtZero: true,

                            ticks: {
                                stepSize: 1
                            }

                        }

                    },

                    plugins: {

                        legend: {
                            display: false
                        }

                    }

                }

            });

        }


        loadDashboard();

    </script>

</body>

</html>
